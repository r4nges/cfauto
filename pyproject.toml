[project]
name = "cfauto"
version = "0.1.0"
description = "CFAUTO — gestão para varejo e serviços"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
    "SQLAlchemy>=2.0.36",
    "alembic>=1.14",
    "APScheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "python-dateutil>=2.9",
]

[project.scripts]
cfauto = "cfauto.ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pyinstaller>=6.11",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfauto"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
packages = ["cfauto"]
ignore_missing_imports = true
check_untyped_defs = true
